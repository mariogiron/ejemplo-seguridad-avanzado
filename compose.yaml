# Keycloak de verdad para el módulo 4. Arranca con: docker compose up
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # Los .json de esta carpeta se importan como realms al arrancar
      - ./keycloak:/opt/keycloak/data/import:ro
